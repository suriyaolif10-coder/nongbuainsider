name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # ทุกชั่วโมง: ดึงข่าวมติชนใหม่แล้ว deploy
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: ดึงหัวข้อข่าวจากมติชน
        run: node scripts/fetch-matichon.mjs
        continue-on-error: true
      - name: ดึงภาพตัวอย่างเว็บ/เพจหน่วยงาน
        run: node scripts/fetch-previews.mjs
        continue-on-error: true
        timeout-minutes: 5
      - run: npm run build
        env:
          # ตั้งใน Settings → Secrets and variables → Actions → Variables
          # (ถ้าไม่ตั้ง เว็บจะทำงานโหมดเดโม localStorage)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
