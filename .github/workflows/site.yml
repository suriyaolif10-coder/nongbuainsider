name: Update news and publish

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, deleted]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[หนองบัว]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests googlenewsdecoder
      - name: Fetch Nong Bua Lamphu news
        run: python scripts/fetch_nongbua.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/build_site.py
      - name: Commit news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news.json n index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update news.json"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # โพสต์ข่าวใหม่ (ที่เพิ่มจากหลังบ้าน) ลงเพจ Facebook หลังเว็บอัปเดตแล้ว — ข้ามถ้ายังไม่ได้ตั้งค่า
      - name: Post new stories to Facebook page
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_MAX_PER_RUN: ${{ vars.FB_MAX_PER_RUN }}
        run: |
          sleep 20  # ให้ GitHub Pages อัปเดตหน้าใหม่ก่อน Facebook มาดึงภาพตัวอย่าง
          python scripts/post_facebook.py
          git add fb_posted.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "บันทึกข่าวที่โพสต์ลงเพจแล้ว"
          git pull --rebase -X theirs origin main
          git push
